[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "quantforge"
version = "0.1.0"
description = "Quantitative finance toolkit: options pricing, risk analytics, alpha strategies, execution simulation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["quantitative-finance", "options-pricing", "risk-management", "algorithmic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "yfinance>=0.2",
    "pyarrow>=12.0",
]

[project.optional-dependencies]
build = ["pybind11>=2.11"]
dev   = ["pytest>=7.4", "pytest-cov"]

[tool.pytest.ini_options]
testpaths = [
    "01_pricing_engine/tests",
    "02_risk_engine/tests",
    "03_alpha_strategy/tests",
    "04_execution_sim/tests",
]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where     = ["."]
include   = ["01_pricing_engine*", "02_risk_engine*", "03_alpha_strategy*", "04_execution_sim*"]
